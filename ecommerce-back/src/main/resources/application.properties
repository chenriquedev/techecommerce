spring.application.name=ecommerce
spring.profiles.active=dev

server.servlet.context-path=/api/v1
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - [%thread] %-5level %logger{2} - %msg%n


springdoc.swagger-ui.path=/swagger

#paths
product.image.path=./images/products
brand.image.path=./images/brands
default.image.path=./images/default
default-image=default-image.png